# Example production inventory (not used by default). Run with:
#   ansible-playbook site.yml -i inventory/example/clients.yml --ask-vault-pass
#
# Enroll tokens live in group_vars/<client>/vault.yml, encrypted with:
#   ansible-vault create inventory/example/group_vars/client_a/vault.yml
#   -> vault_client_a_enroll_token: <token from `central client create client_a`>
all:
  vars:
    vuln_agent_central_url: https://vuln.example.com
  children:
    client_a:
      # Behind a bastion, non-standard SSH port, dedicated key.
      vars:
        ansible_user: deploy
        ansible_port: 2222
        ansible_ssh_private_key_file: ~/.ssh/id_client_a
        ansible_ssh_common_args: -o ProxyJump=jump@bastion.client-a.example.com:22
        vuln_agent_client_id: client_a
        vuln_agent_enroll_token: "{{ vault_client_a_enroll_token }}"
      hosts:
        a-web-1:
          ansible_host: 10.10.0.11
        a-db-1:
          ansible_host: 10.10.0.12
    client_b:
      # Reachable over Tailscale; central reached over the tailnet too.
      vars:
        ansible_user: ubuntu
        ansible_ssh_private_key_file: ~/.ssh/id_client_b
        vuln_agent_central_url: http://central.tailnet-name.ts.net:8080
        vuln_agent_client_id: client_b
        vuln_agent_enroll_token: "{{ vault_client_b_enroll_token }}"
      hosts:
        b-app-1:
          ansible_host: 100.64.0.21
          vuln_agent_hostname_override: b-app-1
