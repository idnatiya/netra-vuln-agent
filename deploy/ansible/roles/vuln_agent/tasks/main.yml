- name: Check required variables
  ansible.builtin.assert:
    that:
      # Empty central_url = standalone (reports kept on the host only).
      - vuln_agent_central_url | length == 0 or vuln_agent_central_url is match('^https?://')
      - (vuln_agent_central_url | length > 0) == (vuln_agent_client_id | length > 0)
      - ansible_facts.architecture in vuln_agent_arch_map
      - vuln_agent_install_method == 'binary'
    fail_msg: >-
      Set both vuln_agent_central_url (http/https) and vuln_agent_client_id, or neither
      for standalone; supported
      architectures: {{ vuln_agent_arch_map.keys() | list }}; install method 'binary'
      (got {{ ansible_facts.architecture }}, {{ vuln_agent_install_method }}).
    quiet: true

- name: Create directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /opt/vuln-agent, mode: "0755" }
    - { path: "{{ vuln_agent_bin_dir }}", mode: "0755" }
    - { path: "{{ vuln_agent_config_path | dirname }}", mode: "0700" }
    - { path: "{{ vuln_agent_state_dir }}", mode: "0700" }
    - { path: "{{ vuln_agent_state_dir }}/spool", mode: "0700" }
    - { path: "{{ vuln_agent_state_dir }}/reports", mode: "0700" }
    - { path: "{{ vuln_agent_state_dir }}/cache", mode: "0700" }

- name: Install agent binary
  ansible.builtin.copy:
    src: "{{ vuln_agent_local_dist }}/vuln-agent-linux-{{ vuln_agent_arch_map[ansible_facts.architecture] }}"
    dest: "{{ vuln_agent_bin_dir }}/vuln-agent"
    owner: root
    group: root
    mode: "0755"

# /usr/bin rather than /usr/local/bin: sudo's secure_path on RHEL 7/8 lacks /usr/local/bin.
- name: Put vuln-agent on PATH
  ansible.builtin.file:
    src: "{{ vuln_agent_bin_dir }}/vuln-agent"
    dest: /usr/bin/vuln-agent
    state: link

- name: Read installed Trivy version
  ansible.builtin.command: "{{ vuln_agent_bin_dir }}/trivy version --format json"
  register: vuln_agent_trivy_installed
  changed_when: false
  failed_when: false

- name: Install pinned Trivy
  when: >-
    vuln_agent_trivy_installed.rc != 0 or
    (vuln_agent_trivy_installed.stdout | from_json).Version != vuln_agent_trivy_version
  vars:
    vuln_agent_trivy_release: "{{ vuln_agent_trivy_base_url }}/v{{ vuln_agent_trivy_version }}"
    vuln_agent_trivy_tarball: "{{ vuln_agent_state_dir }}/trivy.tar.gz"
  block:
    - name: Download Trivy release (checksum verified)
      ansible.builtin.get_url:
        url: "{{ vuln_agent_trivy_release }}/trivy_{{ vuln_agent_trivy_version }}_Linux-{{ vuln_agent_trivy_arch_map[ansible_facts.architecture] }}.tar.gz"
        checksum: "sha256:{{ vuln_agent_trivy_release }}/trivy_{{ vuln_agent_trivy_version }}_checksums.txt"
        dest: "{{ vuln_agent_trivy_tarball }}"
        mode: "0600"

    - name: Extract Trivy binary
      ansible.builtin.unarchive:
        src: "{{ vuln_agent_trivy_tarball }}"
        remote_src: true
        dest: "{{ vuln_agent_bin_dir }}"
        include: [trivy]
        owner: root
        group: root
        mode: "0755"

    - name: Remove Trivy tarball
      ansible.builtin.file:
        path: "{{ vuln_agent_trivy_tarball }}"
        state: absent

# `vuln-agent enroll` rewrites config.yaml with the host token, so the config is
# compared by content (not bytes) and the existing token is carried over.
- name: Read existing config
  ansible.builtin.slurp:
    src: "{{ vuln_agent_config_path }}"
  register: vuln_agent_existing_raw
  failed_when: false
  no_log: true

- name: Compute desired config
  ansible.builtin.set_fact:
    vuln_agent_existing_config: "{{ (vuln_agent_existing_raw.content | b64decode | from_yaml) if vuln_agent_existing_raw.content is defined else {} }}"
    vuln_agent_desired_config:
      central_url: "{{ vuln_agent_central_url }}"
      client_id: "{{ vuln_agent_client_id }}"
      token: "{{ (vuln_agent_existing_raw.content | b64decode | from_yaml).token | default('') if vuln_agent_existing_raw.content is defined else '' }}"
      hostname_override: "{{ vuln_agent_hostname_override }}"
      ca_file: "{{ vuln_agent_ca_file }}"
  no_log: true

- name: Write config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ vuln_agent_config_path }}"
    owner: root
    group: root
    mode: "0600"
  diff: false
  when: vuln_agent_existing_config != vuln_agent_desired_config

- name: Enforce config permissions
  ansible.builtin.file:
    path: "{{ vuln_agent_config_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Enroll host
  when: >-
    vuln_agent_central_url | length > 0 and
    (vuln_agent_desired_config.token | length == 0 or vuln_agent_force_enroll | bool)
  block:
    - name: Check enroll token
      ansible.builtin.assert:
        that: vuln_agent_enroll_token | length > 0
        fail_msg: Host is not enrolled and vuln_agent_enroll_token is empty.
        quiet: true

    - name: Run vuln-agent enroll
      ansible.builtin.command:
        argv: "{{ [vuln_agent_bin_dir ~ '/vuln-agent', 'enroll'] + (['-force'] if vuln_agent_force_enroll | bool else []) }}"
      environment:
        VULN_AGENT_ENROLL_TOKEN: "{{ vuln_agent_enroll_token }}"
      register: vuln_agent_enroll
      failed_when: false
      no_log: true # hides the enroll token from logs and -v output

    - name: Report enroll failure
      ansible.builtin.fail:
        msg: "{{ vuln_agent_enroll.stderr }}"
      when: vuln_agent_enroll.rc != 0

- name: Run vuln-agent check
  ansible.builtin.command: "{{ vuln_agent_bin_dir }}/vuln-agent check"
  changed_when: false

- name: Run one scan
  when: vuln_agent_run_scan | bool
  block:
    - name: Run vuln-agent scan (first run downloads the Trivy DB)
      ansible.builtin.command: "{{ vuln_agent_bin_dir }}/vuln-agent scan"
      async: 3600
      poll: 30
      register: vuln_agent_scan

    - name: Show scan log tail
      ansible.builtin.debug:
        var: vuln_agent_scan.stderr_lines[-3:]
