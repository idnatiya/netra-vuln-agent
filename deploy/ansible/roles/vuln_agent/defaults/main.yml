# With central (per client / group): vuln_agent_central_url, vuln_agent_client_id,
# and vuln_agent_enroll_token (Ansible Vault) for hosts that are not enrolled yet.
# Leave central_url and client_id empty for standalone (reports stay on the host).
vuln_agent_central_url: ""
vuln_agent_client_id: ""
vuln_agent_enroll_token: ""
vuln_agent_hostname_override: ""
vuln_agent_ca_file: ""

# Re-enroll even if a host token exists (e.g. fakecentral restarted, or central_url changed).
vuln_agent_force_enroll: false
# Run one `vuln-agent scan` at the end of the play.
vuln_agent_run_scan: false

# "binary" copies dist/vuln-agent-linux-<arch> from the controller.
# Phase 4 adds "package" (.deb/.rpm with bundled Trivy + systemd timers).
vuln_agent_install_method: binary
vuln_agent_local_dist: "{{ playbook_dir }}/../../dist"

vuln_agent_trivy_version: "0.72.0"
vuln_agent_trivy_base_url: https://github.com/aquasecurity/trivy/releases/download

vuln_agent_bin_dir: /opt/vuln-agent/bin
vuln_agent_config_path: /etc/vuln-agent/config.yaml
vuln_agent_state_dir: /var/lib/vuln-agent
