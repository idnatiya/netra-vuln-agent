# /etc/vuln-agent/config.yaml  (chmod 600, owner root)
#
# Fill in central_url and client_id, then
#   VULN_AGENT_ENROLL_TOKEN=<client enroll token> vuln-agent enroll
#   vuln-agent check
#
# Note: `vuln-agent enroll` rewrites this file; comments will be lost.

# Central URL. Use https; plain http is allowed only over an encrypted
# network such as Tailscale (e.g. http://central.tailnet-name.ts.net:8080)
# and the agent logs a warning on every run. Required.
central_url: https://vuln.example.com

# Client name, as created with `central client create <name>`. Required.
client_id: client_a

# Host token. Leave empty; `vuln-agent enroll` fills it in.
token: ""

# Optional. Empty = OS hostname.
hostname_override: ""

# Optional. Path to a custom CA PEM file if central uses a private CA.
ca_file: ""

# Optional. Folders Trivy should skip, ADDED to the skip list in effect (the
# defaults such as /proc, /sys, /tmp, caches, or the skip_dirs set on central).
# Absolute paths, no commas; "*" globs allowed.
extra_skip_dirs: []
#extra_skip_dirs: ["/data/backup", "/srv/uploads", "/home/*/projects"]

# Optional. Folders scanned for app dependencies (Laravel/Composer vendor,
# node_modules, ...), on top of OS packages. pm2 apps saved with `pm2 save`
# are added automatically. Unset = ["/var/www", "/srv", "/opt"];
# [] = OS packages only (pm2 apps skipped too). Absolute paths.
#app_dirs: ["/var/www", "/srv", "/opt", "/home/deploy/apps"]
